<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dragonbound" />
  <link rel="apple-touch-icon" href="/assets/drakes/ember_front.png" />
  <title>Dragonbound</title>
  <style>
    html, body { margin: 0; padding: 0; background: #10141f; height: 100%; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100dvh; }
    #game { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    canvas { image-rendering: pixelated; }

    /* ── Touch controls (shown only when touch.ts detects a touch device) ── */
    #controls {
      display: none;
      flex: 0 0 215px;
      position: relative;
      background: #171225;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body.touch #controls { display: block; }

    #dpad {
      position: absolute; left: 18px; bottom: 38px;
      width: 140px; height: 140px;
      touch-action: none;
    }
    .dpad-arm { position: absolute; background: #3a3350; border-radius: 8px; }
    .dpad-arm.h { left: 0; top: 47px; width: 140px; height: 46px; }
    .dpad-arm.v { left: 47px; top: 0; width: 46px; height: 140px; }
    #dpad .nub {
      position: absolute; left: 55px; top: 55px; width: 30px; height: 30px;
      background: #2a2440; border-radius: 50%;
    }
    #dpad.active .dpad-arm { background: #4a4266; }

    .ab { position: absolute; border-radius: 50%; color: #efe8f8; font: bold 20px monospace;
          display: flex; align-items: center; justify-content: center; touch-action: none; }
    #btnA { right: 22px; bottom: 78px; width: 74px; height: 74px; background: #7c3a4a; }
    #btnB { right: 106px; bottom: 34px; width: 58px; height: 58px; background: #3a3350; }
    .ab:active, .ab.pressed { filter: brightness(1.35); }

    /* Landscape: float the controls over the game instead of stacking */
    @media (orientation: landscape) {
      body.touch #controls {
        position: absolute; inset: 0; flex: none; background: transparent; pointer-events: none;
      }
      body.touch #controls > * { pointer-events: auto; opacity: 0.55; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="game"></div>
    <div id="controls"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
